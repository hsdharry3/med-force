
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#153b61">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Med Force 3.0">
  <title>Med Force 3.0</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f3f6fa;
      font-family: Arial, sans-serif;
      color: #153b61;
    }
    .app {
      text-align: center;
      padding: 30px;
      max-width: 400px;
    }
    h1 { font-size: 30px; }
    p { color: #667587; line-height: 1.6; }
    button {
      background: #153b61;
      color: white;
      border: 0;
      border-radius: 10px;
      padding: 16px 28px;
      font-size: 17px;
      font-weight: bold;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>MED FORCE 3.0</h1>
    <p>Medical Representative Management System</p>
    <button onclick="openApp()">Open Med Force</button>
    <p>Doctor Visits · GPS Tracking · Reporting</p>
  </div>

  <script>
    function openApp() {
      window.location.href =
      "https://script.google.com/macros/s/AKfycby5yr8Fv-sBHrNCQ5KQ6x7hdIG4iKzvncUGaDZP9rF09SX2sT8j6_HD6z5sGh9VOckR_A/exec";
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
